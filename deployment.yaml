apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-reg-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-reg
  template:
    metadata:
      labels:
        app: event-reg
    spec:
      containers:
      - name: event-reg-app
        image: tanshul12/event-reg:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: event-reg-service
spec:
  type: NodePort
  selector:
    app: event-reg
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30020
